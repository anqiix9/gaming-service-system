<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>陪玩接单系统</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f6f4f8;
            color: #333;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 30px auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .header h1 {
            font-size: 26px;
            margin-bottom: 8px;
        }

        .header p {
            color: #888;
            font-size: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .stat-card p {
            color: #888;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-card h2 {
            font-size: 25px;
        }

        .section {
            background: white;
            padding: 25px;
            border-radius: 18px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .section h2 {
            font-size: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            margin-bottom: 7px;
            color: #555;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #999;
        }

        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        .btn:hover {
            opacity: 0.85;
        }

        .order {
            border: 1px solid #eee;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .order-name {
            font-weight: bold;
        }

        .order-money {
            font-weight: bold;
        }

        .order-info {
            color: #777;
            font-size: 14px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 8px;
            padding: 4px 9px;
            border-radius: 8px;
            font-size: 12px;
        }

        .paid {
            background: #e7f7eb;
            color: #2e8b57;
        }

        .unpaid {
            background: #fff1e5;
            color: #d2691e;
        }

        @media (max-width: 600px) {
            .container {
                width: 94%;
                margin: 15px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎮 陪玩接单系统</h1>
        <p>记录你的每一张单子与工资</p>
    </div>

    <div class="stats">

        <div class="stat-card">
            <p>今日单数</p>
            <h2 id="todayOrders">0</h2>
        </div>

        <div class="stat-card">
            <p>今日工资</p>
            <h2>RM <span id="todayMoney">0</span></h2>
        </div>

        <div class="stat-card">
            <p>本月工资</p>
            <h2>RM <span id="monthMoney">0</span></h2>
        </div>

    </div>

    <div class="section">

        <h2>➕ 新增单子</h2>

        <div class="form-group">
            <label>客户</label>
            <input type="text" id="customer" placeholder="输入客户名字">
        </div>

        <div class="form-group">
            <label>单子类型</label>
            <select id="orderType">
                <option value="陪玩">陪玩</option>
                <option value="代打">代打</option>
                <option value="其他">其他</option>
            </select>
        </div>

        <div class="form-group">
            <label>单子详情</label>
            <textarea id="orderDetail" placeholder="例如：ML 2小时 / 王者3局 / 陪玩语音..."></textarea>
        </div>

        <div class="form-group">
            <label>工资（RM）</label>
            <input type="number" id="salary" placeholder="例如 30">
        </div>

        <div class="form-group">
            <label>状态</label>
            <select id="status">
                <option value="已结">已结</option>
                <option value="未结">未结</option>
            </select>
        </div>

        <button class="btn" onclick="addOrder()">
            添加单子
        </button>

    </div>

    <div class="section">

        <h2>📋 单子记录</h2>

        <div id="orderList">
            <p style="color:#999; text-align:center;">
                暂时没有单子
            </p>
        </div>

    </div>

</div>

<script>
    function addOrder() {
        alert("下一步我们会让这里真正可以添加单子！");
    }
</script>

</body>
</html>
